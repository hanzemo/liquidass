name: build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    env:
      DEVICE_TARGET: "iphone:clang:16.5:14.0"

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: setup theos
        uses: actions/checkout@v4
        with:
          repository: roothide/theos
          path: theos
          submodules: recursive

      - name: cache sdks
        id: cache-sdks
        uses: actions/cache@v4
        with:
          path: theos/sdks
          key: theos-sdks-16.5

      - name: download sdks
        if: steps.cache-sdks.outputs.cache-hit != 'true'
        run: |
          curl -LO https://github.com/theos/sdks/archive/master.zip
          unzip -q master.zip
          mkdir -p theos/sdks
          mv sdks-master/*.sdk theos/sdks/
          rm -rf master.zip sdks-master

      - name: set THEOS env var
        run: echo "THEOS=$GITHUB_WORKSPACE/theos" >> $GITHUB_ENV

      - name: install deps
        run: |
          brew install ldid make
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH

      - name: install AltList into Theos
        run: |
          git clone --depth 1 https://github.com/opa334/AltList.git /tmp/AltList
          cd /tmp/AltList
          make clean || true
          make FINALPACKAGE=1 THEOS="$THEOS" TARGET="$DEVICE_TARGET" || true
          for dir in lib lib/iphone/rootless/lib lib/iphone/rootful/lib; do
            mkdir -p "$THEOS/$dir"
            cp -Rv /tmp/AltList/.theos/obj/AltList.framework "$THEOS/$dir/" 2>/dev/null || true
          done

      - name: patch registerCustomFilter
        run: python3 .github/patch_retry.py

      - name: show patched block
        run: |
          grep -n -A 30 "filter_table null" LiquidAssBackboardd/Tweak.mm || true

      - name: build roothide
        run: |
          make clean
          make package \
            ARCHS="arm64 arm64e" \
            TARGET="$DEVICE_TARGET" \
            FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME=roothide

      - name: upload package
        uses: actions/upload-artifact@v4
        with:
          name: roothide-package
          path: packages/*.deb
